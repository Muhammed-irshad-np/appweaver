<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" width="400" height="80">
  <defs>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
  </defs>

  <!-- Rocket icon (simplified) -->
  <g transform="translate(10, 8) scale(0.065)">
    <!-- Ring -->
    <path d="M 500 500 M 500 122 A 378 378 0 1 1 499.9 122 M 500 220 A 280 280 0 1 0 500.1 220 Z" fill="url(#mintGrad)" fill-rule="evenodd" />
    <!-- Flame -->
    <polygon points="450,584 500,822 550,584" fill="url(#orangeGrad)"/>
    <!-- Wings -->
    <polygon points="500,164 346,654 425,626" fill="#A0B4C8"/>
    <polygon points="500,164 654,654 575,626" fill="#A0B4C8"/>
    <!-- Body -->
    <polygon points="500,164 425,612 500,612" fill="#EBEFF5"/>
    <polygon points="500,164 500,612 575,612" fill="#FFFFFF"/>
    <!-- Window -->
    <circle cx="500" cy="430" r="33" fill="#10B981"/>
    <circle cx="500" cy="430" r="20" fill="#FFFFFF"/>
  </g>

  <!-- Text -->
  <text x="88" y="53" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="36" fill="#F8FAFC" letter-spacing="-1">
    Ready<tspan fill="url(#mintGrad)">DM</tspan>
  </text>
</svg>
